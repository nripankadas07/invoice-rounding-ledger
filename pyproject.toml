[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-rounding-ledger"
version = "0.1.0"
description = "Offline captured-input analysis with explicit evidence and bounded contracts"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dr. Nripanka Das"}]
dependencies = []

[project.scripts]
invoice-rounding-ledger = "invoice_rounding_ledger:main"

[tool.setuptools]
py-modules = ["invoice_rounding_ledger"]
